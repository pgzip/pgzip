# This workflow dynamically discovers currently supported (non-EOL) Python versions,
# runs tests across all of them, and runs lint checks.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run tests
on:
  push:
    #branches: [ master ]
  pull_request:
    #branches: [ master ]
  schedule:
    - cron: "0 12 * * 5" # Weekly on Friday at 12:00 UTC
  workflow_dispatch:

jobs:
  setup:
    name: Discover supported Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch supported Python versions
        id: versions
        run: |
          VERSIONS_JSON=$(python3 scripts/supported_python_versions.py --json)
          echo "Discovered versions: $VERSIONS_JSON"
          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Test (Python ${{ matrix.python-version }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.versions).supported }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Test with hatch
        run: |
          hatch run test

  test-prerelease:
    name: Test pre-release (Python ${{ matrix.python-version }})
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.versions).prerelease[0] != null }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.versions).prerelease }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Test with hatch
        run: |
          hatch run test

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ fromJson(needs.setup.outputs.versions).latest_stable }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJson(needs.setup.outputs.versions).latest_stable }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Lint with hatch
        run: |
          hatch run lint:check
